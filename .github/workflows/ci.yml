# CI: run the test suite (incl. parity tests against PyMuPDF) on Linux and Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Import check
        run: python -I -c "import belegtool_compress, belegtool_compress.compress, belegtool_compress.cpu, belegtool_compress.raster"
      - name: Tests
        run: python -m pytest
